<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F1E5;
    --surface: #FFFFFF;
    --surface-alt: #EFEADB;
    --ink: #211F19;
    --ink-soft: #5B5648;
    --ink-faint: #6B6558;
    --primary: #1F4A3D;
    --primary-dark: #143128;
    --primary-soft: #E2EAE4;
    --accent: #B75A2E;
    --accent-dark: #93441F;
    --gold: #B4863C;
    --gold-text: #6B4E1E;
    --gold-soft: #F1E6CE;
    --danger: #A23B33;
    --danger-soft: #F3DEDA;
    --warning: #B4863C;
    --warning-soft: #F1E6CE;
    --success: #2F6B52;
    --success-soft: #DEEAE2;
    --border: #DED6C0;
    --border-soft: #E9E3D2;
    --shadow-sm: 0 1px 2px rgba(33,31,25,.05);
    --shadow-md: 0 10px 30px -14px rgba(33,31,25,.22), 0 2px 6px -2px rgba(33,31,25,.08);
    --shadow-lg: 0 24px 60px -20px rgba(20,49,40,.28);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 18px;
    --radius-pill: 999px;
    --font-display: "Source Serif 4", "Source Serif Pro", Georgia, serif;
    --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-7: 32px;
    --space-8: 40px;
    --space-9: 56px;
    --space-10: 72px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 {
    font-family: var(--font-display);
    color: var(--ink);
    margin: 0 0 var(--space-3) 0;
    font-weight: 600;
    line-height: 1.2;
  }

  a { color: var(--primary); }

  .tabular { font-variant-numeric: tabular-nums; }

  .font-display { font-family: var(--font-display); }

  .eyebrow {
    display: inline-block;
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: var(--space-2);
  }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    font-family: var(--font-ui);
    font-size: 14px;
    font-weight: 600;
    line-height: 1.2;
    padding: 10px 20px;
    border-radius: var(--radius-md);
    border: 1px solid transparent;
    cursor: pointer;
    text-decoration: none;
    transition: background-color .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease, transform .05s ease;
    user-select: none;
  }
  .btn:active { transform: translateY(1px); }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }

  .btn-secondary {
    background: var(--surface);
    border-color: var(--border);
    color: var(--ink);
  }
  .btn-secondary:hover { background: var(--surface-alt); border-color: var(--ink-faint); }

  .btn-ghost {
    background: transparent;
    border-color: transparent;
    color: var(--primary);
  }
  .btn-ghost:hover { background: var(--primary-soft); }

  .btn-danger-ghost {
    background: transparent;
    border-color: transparent;
    color: var(--danger);
  }
  .btn-danger-ghost:hover { background: var(--danger-soft); }

  .btn-block { display: flex; width: 100%; }

  .btn-lg { padding: 13px 26px; font-size: 16px; border-radius: var(--radius-lg); }

  .btn-sm { padding: 6px 14px; font-size: 13px; border-radius: var(--radius-sm); }

  /* Inline variant: usable in running text/links (e.g. redirectTop()'s
     dynamically-inserted <a class="btn-primary btn-inline">, which does NOT
     carry the bare .btn class). It must render as a full, padded button on
     its own — the base .btn padding is repeated here so it does not depend
     on .btn being present. This anchor is the ONLY visible content on a
     GAS-sandbox-navigation fallback page, so it must look like a real button. */
  .btn-inline {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    font-family: var(--font-ui);
    font-size: 14px;
    font-weight: 600;
    line-height: 1.2;
    padding: 10px 20px;
    border-radius: var(--radius-md);
    border: 1px solid transparent;
    text-decoration: none;
    cursor: pointer;
    margin: 0 var(--space-1);
  }

  /* ---------- Card ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    padding: var(--space-6);
  }

  /* ---------- Badges ---------- */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: var(--space-1);
    font-size: 12px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: var(--radius-pill);
    line-height: 1.4;
    white-space: nowrap;
  }
  /* NOTE: badge-draft & badge-final are deliberately remapped away from the
     bundle's gold/warning colors. Gold-as-text on gold-soft is only 2.64:1
     (fails WCAG AA). Remapped to ink-soft/success (both >=5:1, pass AA).
     Not a diff mistake vs the design bundle — an intentional a11y fix. */
  .badge-draft { background: var(--border-soft); color: var(--ink-soft); }
  /* NOTE: .badge-tersimpan is currently unused/reserved — no page file
     references it, the "Tersimpan" label uses .badge-final instead (Task
     16 remap). Kept in place in case a future page needs this variant. */
  .badge-tersimpan { background: var(--gold-soft); color: var(--gold-text); }
  .badge-final { background: var(--success-soft); color: var(--success); }
  .badge-belum { background: var(--danger-soft); color: var(--danger); }
  .badge-aktif { background: var(--success-soft); color: var(--success); }
  .badge-nonaktif { background: var(--border-soft); color: var(--ink-faint); }

  /* ---------- Form fields ---------- */
  .field { margin-bottom: var(--space-4); }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: var(--space-2);
  }

  .input, .select, .textarea {
    width: 100%;
    font-family: var(--font-ui);
    font-size: 15px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .input:focus, .select:focus, .textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft);
  }
  .textarea { resize: vertical; min-height: 88px; }

  .input-nip { font-variant-numeric: tabular-nums; letter-spacing: .02em; }

  /* ---------- Crest ---------- */
  .lambang-logo {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* ---------- Misc ---------- */
  .error-message {
    color: var(--danger);
    background: var(--danger-soft);
    border-radius: var(--radius-sm);
    padding: var(--space-3) var(--space-4);
    font-size: 14px;
  }

  .loading {
    color: var(--ink-faint);
    font-size: 14px;
  }

  /* ===== UI Feedback Kit — confirm dialog & toast, konsisten dgn tokens.css =====
     NOTE variant "warning": --warning/--warning-soft SUDAH ADA di :root di atas
     (nilainya sama persis dengan --gold/--gold-soft — token warna amber/emas ini
     memang dipakai dobel sebagai alias "warning" sejak awal, bukan token baru). */
  .ui-overlay{
    position:fixed;inset:0;background:rgba(20,30,25,.5);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:200;padding:var(--space-5);
    opacity:0;pointer-events:none;transition:opacity .18s ease;
  }
  .ui-overlay.open{opacity:1;pointer-events:auto;}
  .ui-dialog{
    background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
    width:100%;max-width:360px;padding:var(--space-6) var(--space-6) var(--space-5);
    text-align:center;transform:translateY(10px) scale(.98);transition:transform .18s ease;
  }
  .ui-overlay.open .ui-dialog{transform:translateY(0) scale(1);}
  .ui-dialog-icon{
    width:52px;height:52px;border-radius:50%;margin:0 auto var(--space-4);
    display:flex;align-items:center;justify-content:center;
  }
  .ui-dialog-icon.variant-danger{background:var(--danger-soft);color:var(--danger);}
  .ui-dialog-icon.variant-warning{background:var(--warning-soft);color:var(--warning);}
  .ui-dialog-icon.variant-success{background:var(--success-soft);color:var(--success);}
  .ui-dialog-icon.variant-info{background:var(--primary-soft);color:var(--primary);}
  .ui-dialog h3{font-size:17px;margin-bottom:6px;}
  .ui-dialog p{font-size:13.5px;color:var(--ink-soft);line-height:1.55;margin-bottom:var(--space-6);}
  .ui-dialog-actions{display:flex;gap:10px;}
  .ui-dialog-actions .btn{flex:1;}


  .ui-toast-stack{
    position:fixed;top:var(--space-5);left:50%;transform:translateX(-50%);
    z-index:300;display:flex;flex-direction:column;gap:10px;width:100%;max-width:380px;padding:0 var(--space-5);
    pointer-events:none;
  }
  .ui-toast{
    pointer-events:auto;
    background:var(--surface);border:1px solid var(--border-soft);border-left:3px solid var(--primary);
    border-radius:10px;box-shadow:var(--shadow-md);padding:13px 16px;
    display:flex;align-items:flex-start;gap:10px;
    opacity:0;transform:translateY(-12px);transition:opacity .2s ease, transform .2s ease;
  }
  .ui-toast.show{opacity:1;transform:translateY(0);}
  .ui-toast.variant-success{border-left-color:var(--success);}
  .ui-toast.variant-error{border-left-color:var(--danger);}
  .ui-toast.variant-info{border-left-color:var(--primary);}
  .ui-toast-icon{flex-shrink:0;margin-top:1px;}
  .ui-toast-icon.variant-success{color:var(--success);}
  .ui-toast-icon.variant-error{color:var(--danger);}
  .ui-toast-icon.variant-info{color:var(--primary);}
  .ui-toast-text{flex:1;font-size:13px;color:var(--ink);line-height:1.45;}
  .ui-toast-close{flex-shrink:0;color:var(--ink-faint);cursor:pointer;padding:2px;}
  .ui-toast-close:hover{color:var(--ink);}
  @media (max-width:480px){
    .ui-toast-stack{top:auto;bottom:var(--space-5);}
  }
</style>
<script>
  // Apps Script menjalankan halaman di dalam iframe sandbox dengan
  // `allow-top-navigation-by-user-activation` — navigasi lewat
  // `window.location.href` yang dipicu setelah jeda async (mis. callback
  // google.script.run) bisa ditolak diam-diam (layar putih macet, tanpa
  // error). Klik anchor asli lebih diterima sandbox. Href relatif ('?page=..')
  // JUGA tidak bisa dipakai langsung: karena elemen anchor ini dibuat di
  // dalam dokumen iframe sandbox, href relatif ke-resolve ke origin sandbox
  // (script.googleusercontent.com), bukan URL asli aplikasi (script.google.com/
  // .../exec) — walau target="_top" mengarahkan NAVIGASI ke top frame, URL-nya
  // sendiri tetap salah. SIRAJIN_BASE_URL disuntik dari server lewat
  // ScriptApp.getService().getUrl() (satu-satunya sumber URL exec yang bisa
  // dipercaya dari sisi client) supaya href-nya selalu benar. Link tetap
  // ditinggal terlihat & bisa diklik manual kalau auto-redirect tetap gagal —
  // pengguna tidak pernah terjebak layar kosong tanpa jalan keluar.
  var SIRAJIN_BASE_URL = '<?= ScriptApp.getService().getUrl() ?>';
  var SIRAJIN_LOGO_SRC = '<?= getLogoDataUri_() ?>';

  // PAKAI localStorage, BUKAN sessionStorage. GAS me-recreate sandbox iframe
  // (sekaligus sessionStorage-nya) pada SETIAP top-level doGet reload, jadi
  // token yang disimpan di sessionStorage HILANG begitu redirect login->
  // aktivitas terjadi -> guard getToken() gagal -> pegawai dilempar balik ke
  // login terus-menerus. localStorage selamat lintas reload (dibuktikan live
  // 2026-08-24: ls_probe bertahan, sessionStorage token null setelah nav).
  function getToken() { return localStorage.getItem('sirajin_token'); }
  function setToken(t) { localStorage.setItem('sirajin_token', t); }
  function clearToken() { localStorage.removeItem('sirajin_token'); }

  // pesan (kalau ada) adalah kalimat INTI-nya saja ("Berhasil masuk", bukan
  // "Berhasil masuk. Klik di sini untuk lanjut →") — dua tempat yang
  // memakainya punya kebutuhan teks berbeda, jadi disusun terpisah di sini:
  // (1) tombol fallback dapat ajakan klik generik ditempel di belakangnya,
  // (2) toast (lihat listener DOMContentLoaded di bawah) dapat pesan INTI-nya
  // saja, tanpa embel-embel "klik di sini" yang gak relevan buat notifikasi
  // pasif. Toast ditampilkan di halaman TUJUAN setelah load (bukan di sini)
  // karena top-level reload GAS memutus konteks JS halaman asal. isError=true
  // -> toast merah (redirect sesi habis/ditolak); default false -> hijau (sukses).
  function redirectTop(queryString, pesan, isError) {
    var url = SIRAJIN_BASE_URL + queryString;
    if (pesan) {
      try {
        localStorage.setItem('sirajin_pending_toast', JSON.stringify({ message: pesan, isError: !!isError }));
      } catch (e) { /* storage penuh/diblokir - toast di halaman tujuan cuma gak muncul, gak fatal */ }
    }

    // Navigasi top-level dari dalam iframe sandbox GAS.
    //
    // Android Chrome: window.top.location / a.click() programmatik DITERIMA
    // walau dipicu setelah callback async -> redirect mulus.
    // Safari iOS: LEBIH KETAT. Top-navigation dari iframe sandbox hanya boleh
    // dari gesture user LANGSUNG; setelah callback async google.script.run,
    // gesture sudah hangus -> nav programmatik ditolak diam-diam.
    //
    // Untuk alur yang butuh andal di iOS (mis. login), PEMANGGIL sebaiknya
    // memunculkan UIAlert.alert() dulu lalu memanggil redirectTop() dari dalam
    // handler klik OK-nya — saat itu gesture masih segar, jadi nav di bawah
    // ini berjalan langsung. Fungsi ini tetap menyediakan tombol fallback
    // tersembunyi sebagai jaring terakhir untuk pemanggil non-gesture.
    var a = document.createElement('a');
    a.href = url;
    a.target = '_top';
    a.className = 'btn btn-primary btn-inline';
    a.style.marginTop = '12px';
    a.textContent = (pesan ? pesan + '. ' : '') + 'Klik di sini untuk lanjut →';
    a.style.visibility = 'hidden';
    document.body.insertBefore(a, document.body.firstChild);

    var timerTampilkan = setTimeout(function () { a.style.visibility = 'visible'; }, 8000);
    window.addEventListener('pagehide', function () { clearTimeout(timerTampilkan); });

    try { window.top.location.href = url; } catch (e) { a.click(); }
  }

  // Tampilkan toast yang "dititipkan" redirectTop() di atas, sekali, lalu
  // hapus dari storage. DOMContentLoaded dipakai (bukan langsung dieksekusi)
  // karena Shared.html di-include di <head> - document.body/UIAlert punya
  // dependensi DOM yang belum tentu siap kalau dijalankan sinkron di sini.
  document.addEventListener('DOMContentLoaded', function () {
    try {
      var raw = localStorage.getItem('sirajin_pending_toast');
      if (!raw) return;
      localStorage.removeItem('sirajin_pending_toast');
      var data = JSON.parse(raw);
      if (data && data.message) showToast(data.message, !!data.isError);
    } catch (e) { /* abaikan - toast bukan hal kritis */ }
  });

  /* ===== UI Feedback Kit — window.UIAlert ===== */
  (function(){
    var ICONS = {
      danger: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 9v4M12 16.5v.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M10.3 3.8 2.6 17.5A1.8 1.8 0 0 0 4.2 20.2h15.6a1.8 1.8 0 0 0 1.6-2.7L13.7 3.8a1.8 1.8 0 0 0-3.4 0Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
      warning: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v5M12 15.5v.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
      success: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M8.2 12.3l2.4 2.4 5.2-5.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      info: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v5.5M12 8v.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
      error: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v5M12 15.5v.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'
    };

    function ensureToastStack(){
      var stack = document.querySelector('.ui-toast-stack');
      if(!stack){
        stack = document.createElement('div');
        stack.className = 'ui-toast-stack';
        document.body.appendChild(stack);
      }
      return stack;
    }

    function confirmDialog(opts){
      opts = opts || {};
      var variant = opts.variant || 'warning';
      return new Promise(function(resolve){
        var overlay = document.createElement('div');
        overlay.className = 'ui-overlay';
        overlay.innerHTML =
          '<div class="ui-dialog" role="alertdialog" aria-modal="true">' +
            '<div class="ui-dialog-icon variant-' + variant + '">' + (ICONS[variant] || ICONS.warning) + '</div>' +
            '<h3 class="font-display">' + (opts.title || 'Anda yakin?') + '</h3>' +
            '<p>' + (opts.message || '') + '</p>' +
            '<div class="ui-dialog-actions">' +
              '<button type="button" class="btn btn-secondary" data-act="cancel">' + (opts.cancelText || 'Batal') + '</button>' +
              '<button type="button" class="btn btn-primary" data-act="confirm">' + (opts.confirmText || 'Ya, Lanjutkan') + '</button>' +
            '</div>' +
          '</div>';

        document.body.appendChild(overlay);
        requestAnimationFrame(function(){ overlay.classList.add('open'); });

        function close(result){
          overlay.classList.remove('open');
          setTimeout(function(){ overlay.remove(); }, 180);
          resolve(result);
        }

        overlay.querySelector('[data-act="cancel"]').addEventListener('click', function(){ close(false); });
        overlay.querySelector('[data-act="confirm"]').addEventListener('click', function(){ close(true); });
        overlay.addEventListener('click', function(e){ if(e.target === overlay) close(false); });
      });
    }

    // Varian satu-tombol dari confirmDialog di atas — buat notifikasi hasil
    // ("Berhasil!"), bukan pertanyaan ya/tidak. Dipakai antara lain menggantikan
    // pola redirectTop(pesan)-otomatis di alur yang lambat & sering makan waktu
    // lebih dari jendela aktivasi klik browser (mis. simpan aktivitas: upload
    // foto + generate PDF) — auto-redirect diam-diam gagal di situ, ditolak
    // sandbox GAS, dan pengguna nyangkut. Dialog ini justru MINTA satu klik
    // eksplisit, lalu redirect dijalankan dari klik itu sendiri (aktivasi
    // browser-nya masih segar saat itu), jadi navigasinya andal.
    function alertDialog(opts){
      opts = opts || {};
      var variant = opts.variant || 'success';
      return new Promise(function(resolve){
        var overlay = document.createElement('div');
        overlay.className = 'ui-overlay';
        overlay.innerHTML =
          '<div class="ui-dialog" role="alertdialog" aria-modal="true">' +
            '<div class="ui-dialog-icon variant-' + variant + '">' + (ICONS[variant] || ICONS.success) + '</div>' +
            '<h3 class="font-display">' + (opts.title || 'Berhasil') + '</h3>' +
            '<p>' + (opts.message || '') + '</p>' +
            '<div class="ui-dialog-actions">' +
              '<button type="button" class="btn btn-primary" data-act="ok">' + (opts.okText || 'OK') + '</button>' +
            '</div>' +
          '</div>';

        document.body.appendChild(overlay);
        requestAnimationFrame(function(){ overlay.classList.add('open'); });

        function close(){
          overlay.classList.remove('open');
          setTimeout(function(){ overlay.remove(); }, 180);
          resolve();
        }

        overlay.querySelector('[data-act="ok"]').addEventListener('click', close);
      });
    }

    // NOTE bawaan bundle: toast() aslinya nyusun pesan langsung ke innerHTML
    // via string concat (gak escape HTML) — risiko nyata karena pesan error
    // server (result.message) lewat jalur ini. Di sini span teksnya dibiarkan
    // kosong di template innerHTML, lalu diisi lewat textContent (aman, gak
    // bisa nyuntik HTML).
    function toastFn(opts){
      opts = opts || {};
      var type = opts.type || 'info';
      var duration = opts.duration || 4000;
      var stack = ensureToastStack();

      var el = document.createElement('div');
      el.className = 'ui-toast variant-' + type;
      el.innerHTML =
        '<span class="ui-toast-icon variant-' + type + '">' + (ICONS[type] || ICONS.info) + '</span>' +
        '<span class="ui-toast-text"></span>' +
        '<span class="ui-toast-close" data-act="close">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>' +
        '</span>';
      el.querySelector('.ui-toast-text').textContent = opts.message || '';

      stack.appendChild(el);
      requestAnimationFrame(function(){ el.classList.add('show'); });

      function dismiss(){
        el.classList.remove('show');
        setTimeout(function(){ el.remove(); }, 200);
      }
      el.querySelector('[data-act="close"]').addEventListener('click', dismiss);
      if(duration > 0) setTimeout(dismiss, duration);
    }

    window.UIAlert = {
      confirm: confirmDialog,
      alert: alertDialog,
      toast: toastFn,
      success: function(message){ toastFn({type:'success', message: message}); },
      error: function(message){ toastFn({type:'error', message: message}); },
      info: function(message){ toastFn({type:'info', message: message}); }
    };
  })();

  // Pengganti window.alert() — notifikasi singkat yang gak menghentikan
  // eksekusi JS dan gak keliatan kayak popup browser generik. Sekarang cuma
  // delegasi ke UIAlert.toast() (stacked-toast) — signature dipertahankan
  // sama persis (showToast(message, isError)) supaya semua call site lain
  // di aplikasi jalan tanpa perubahan apapun.
  function showToast(message, isError) {
    UIAlert.toast({ type: isError ? 'error' : 'success', message: message });
  }

  // Masalah href relatif di atas gak cuma soal redirect lewat JS — SETIAP
  // <a href="?page=..."> biasa di HTML (nav, tombol Edit/Tambah, dst) juga
  // navigasi ke origin sandbox yang salah kalau diklik langsung, bikin
  // halaman blank total. Daripada nambal href satu-satu di tiap file
  // (termasuk yang dibikin dinamis lewat innerHTML), satu listener klik
  // ter-delegasi di sini mencegat SEMUA link berformat itu dan
  // reroute lewat redirectTop() — mencakup link yang ada sekarang maupun
  // yang ditambahkan nanti.
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="?"]');
    if (!a) return;
    e.preventDefault();
    redirectTop(a.getAttribute('href'));
  });

  // Dipakai di seluruh halaman (pegawai & admin, lewat AdminShared.html yang
  // meng-include file ini) untuk merender teks bebas ketikan user ke innerHTML
  // dengan aman. Sebelumnya terduplikasi identik di AdminShared.html &
  // Aktivitas.html — dipromosikan ke sini supaya satu sumber kebenaran.
  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // Port verbatim dari src/Utils.js (server, GAS-independent) supaya format
  // durasi identik di seluruh aplikasi. Sebelumnya terduplikasi identik di
  // Aktivitas.html, TambahAktivitas.html, AdminDashboard.html, AdminLaporan.html
  // — dipromosikan ke sini supaya satu sumber kebenaran.
  function formatDuration(totalMinutes) {
    var jam = Math.floor(totalMinutes / 60);
    var menit = totalMinutes % 60;
    var parts = [];
    if (jam > 0) parts.push(jam + ' Jam');
    if (menit > 0 || jam === 0) parts.push(menit + ' Menit');
    return parts.join(' ') + ' (' + totalMinutes + ' Menit)';
  }

  function requireLogin() {
    if (!getToken()) { redirectTop('?page=login', 'Sesi belum login', true); }
  }
  function handleSessionExpiry(message, redirectTo) {
    if (message && message.indexOf('login ulang') > -1) {
      clearToken();
      redirectTop(redirectTo || '?page=login', 'Sesi berakhir, silakan login ulang', true);
      return true;
    }
    return false;
  }
</script>
