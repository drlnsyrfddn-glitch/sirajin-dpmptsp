<!DOCTYPE html>
<html>
  <head><base target="_top"><?!= include('Shared'); ?></head>
  <body>
    <main class="split-shell">
      <section class="split-brand">
        <div class="pita-lambang"><span></span><span></span><span></span><span></span></div>
        <img class="lambang-logo" alt="Lambang Kabupaten Morowali">
        <script>document.currentScript.previousElementSibling.src = SIRAJIN_LOGO_SRC;</script>
        <p class="brand-name">SiRajin Morowali</p>
        <p class="split-motto">Tepe Asa Maroso</p>
      </section>
      <section class="split-form">
        <h1>Login Admin</h1>
        <div class="field">
          <label for="nip">NIP</label>
          <input type="text" id="nip" inputmode="numeric" autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password">
        </div>
        <button class="btn-primary" id="btnLogin">Masuk</button>
        <p class="error-message" id="errorMsg" style="display:none;"></p>
      </section>
    </main>

    <script>
      document.getElementById('btnLogin').addEventListener('click', function () {
        var nip = document.getElementById('nip').value.trim();
        var password = document.getElementById('password').value;
        var btn = document.getElementById('btnLogin');
        var errorEl = document.getElementById('errorMsg');
        errorEl.style.display = 'none';

        if (!nip || !password) {
          errorEl.textContent = 'NIP dan password wajib diisi.';
          errorEl.style.display = 'block';
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Memproses...';

        google.script.run
          .withSuccessHandler(function (result) {
            btn.disabled = false;
            btn.textContent = 'Masuk';
            if (result.success) {
              setToken(result.token);
              redirectTop('?page=admin', 'Berhasil masuk. Klik di sini untuk lanjut ke Dashboard →');
            } else {
              errorEl.textContent = result.message;
              errorEl.style.display = 'block';
            }
          })
          .withFailureHandler(function (error) {
            btn.disabled = false;
            btn.textContent = 'Masuk';
            errorEl.textContent = 'Gagal terhubung ke server: ' + error.message + '. Coba lagi.';
            errorEl.style.display = 'block';
          })
          .loginAdmin(nip, password);
      });
    </script>
  </body>
</html>
